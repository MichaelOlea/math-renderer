name: Rendering tests

# Opens math-rendere.html in a headless browser at eight screen sizes and checks
# that every card, step, hint and review page is aligned, fits and is readable.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Keep the report (with screenshots of every failing screen)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rendering-report
          path: playwright-report/
          retention-days: 14
